service: dumpmap-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  httpApi:
    cors:
      allowedOrigins:
        - https://dump-map.netlify.app
        - http://localhost:5173
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - OPTIONS
  environment:
    REPORTS_TABLE: ${self:service}-${sls:stage}-reports
    WORKERS_TABLE: ${self:service}-${sls:stage}-workers
    UPLOAD_BUCKET: ${self:service}-${sls:stage}-uploads-${aws:accountId}
    COGNITO_USER_POOL_ID: ap-south-1_igoGrvGIP
    COGNITO_CLIENT_ID: 55dht6jg5ta3c3heobhneh5na8
    COGNITO_REGION: ap-south-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
          Resource: "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.REPORTS_TABLE}"
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:Query
          Resource: "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.WORKERS_TABLE}"
        - Effect: Allow
          Action:
            - rekognition:DetectLabels
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: "arn:aws:s3:::${self:provider.environment.UPLOAD_BUCKET}/*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminListGroupsForUser
          Resource: "arn:aws:cognito-idp:ap-south-1:${aws:accountId}:userpool/ap-south-1_igoGrvGIP"

functions:
  getUploadUrl:
    handler: src/handlers.getUploadUrl
    events:
      - httpApi:
          path: /upload-url
          method: get
          # In production, enable authorizer here to restrict to logged-in users

  createReport:
    handler: src/handlers.createReport
    events:
      - httpApi:
          path: /reports
          method: post

  getReports:
    handler: src/handlers.getReports
    events:
      - httpApi:
          path: /reports
          method: get

  updateReportStatus:
    handler: src/handlers.updateReportStatus
    events:
      - httpApi:
          path: /reports/{id}
          method: put

  verifyWorker:
    handler: src/handlers.verifyWorker
    events:
      - httpApi:
          path: /verify-worker
          method: post

  verifyImage:
    handler: src/handlers.verifyImage
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt:
              - ReportsTable
              - StreamArn
          startingPosition: LATEST

resources:
  Resources:
    ReportsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.REPORTS_TABLE}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    UploadBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.UPLOAD_BUCKET}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - "*"
              AllowedMethods:
                - PUT
                - GET
              AllowedOrigins:
                - "*" # Restrict this to your frontend domain in production
              MaxAge: 3000

    UploadBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref UploadBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Action:
                - "s3:GetObject"
              Effect: Allow
              Resource: !Join
                - ""
                - - "arn:aws:s3:::"
                  - !Ref UploadBucket
                  - "/*"
              Principal: "*"
    WorkersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.WORKERS_TABLE}
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
